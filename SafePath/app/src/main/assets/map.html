<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>SafePath Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        html, body {
            height: 100%;
            margin: 0;
            background: #121212;
        }
        #map {
            height: 100%;
            width: 100%;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div id="map"></div>

<script>
    // Default fallback location (Kolhapur)
    const map = L.map('map').setView([16.7049, 74.2433], 13);

    // Tile Layer (OpenStreetMap)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/">OpenStreetMap</a> contributors'
    }).addTo(map);

    // This function gets called from Android Java side
    function updateUserLocation(lat, lng) {
        console.log("Lat: " + lat + " | Lng: " + lng);

        const marker = L.marker([lat, lng]).addTo(map)
            .bindPopup("📍 You are here")
            .openPopup();

        map.setView([lat, lng], 15); // Zoom into current location
    }

</script>

</body>
</html>
